name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xtreme-fitness-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: xtreme-fitness-app
      - name: Run ESLint
        run: npm run lint
        working-directory: xtreme-fitness-app

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xtreme-fitness-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: xtreme-fitness-app
      # Catches nothing the other jobs do: they both pass on badly formatted code.
      - name: Check formatting
        run: npm run format:check
        working-directory: xtreme-fitness-app

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xtreme-fitness-app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: xtreme-fitness-app
      # Also type-checks: next build fails on TypeScript errors.
      # No API needed — the pages that fetch are dynamic, so nothing runs at build time.
      - name: Build
        run: npm run build
        working-directory: xtreme-fitness-app
